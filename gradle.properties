# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Enables Gradle caching
org.gradle.caching=true

# Set the maximum number of workers to 4 to avoid overloading the machine.
org.gradle.workers.max=4

# Set the Kotlin compiler execution strategy to in-process to avoid
# "Could not connect to Kotlin compile daemon" error.
kotlin.compiler.execution.strategy=in-process

# Enable configuration cache
org.gradle.configuration-cache=true

# Kotlin Multiplatform: evita commonizar advertencias en dependencias nativas
kotlin.mpp.enableCInteropCommonization=true

# Los targets iOS no se pueden compilar sin Xcode/macOS: silencia el aviso en Windows/Linux
kotlin.native.ignoreDisabledTargets=true

# Compose Multiplatform: usa recursos compartidos entre Android e iOS
org.jetbrains.compose.experimental.uikit.enabled=true

# AndroidX (requerido por Room/Koin/Compose)
android.useAndroidX=true
