build:
  maxIssues: 0

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false

complexity:
  LongMethod:
    threshold: 60
  # Un DAO de Room es por naturaleza una lista larga de consultas (leer, filtrar, borrados
  # conjuntos, marcas de sincronizacion), y los repositorios implementan esa misma interfaz:
  # el limite por defecto de 11 funciones no encaja con :core:database ni con :core:data.
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20
  # AgendaTextField (core:designsystem) es un campo de texto generico reutilizado en toda
  # la app (login, registro, formulario de tareas): valor, cambio, etiqueta, modifier,
  # contrasena, numerico, texto de ayuda y error son 8 opciones razonables para un unico
  # componente compartido, no una señal de diseño confuso (el compilador de Compose añade
  # un parametro implicito mas a las funciones @Composable, de ahi el 9 y no el 8).
  # TasksViewModel recibe 9 casos de uso independientes (uno por accion: observar, guardar,
  # borrar uno, borrar varios, borrar todo, alternar completada, sincronizar, tiempo real,
  # generar copias de una tarea incremental); es la consecuencia natural de casos de uso
  # granulares (un caso de uso = una accion), no una senal de que el ViewModel tenga
  # demasiadas responsabilidades.
  LongParameterList:
    functionThreshold: 9
    constructorThreshold: 10

naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
  # Los ficheros expect/actual siguen la convencion Foo.android.kt / Foo.ios.kt de KMP,
  # que esta regla no reconoce como "coincide con la declaracion".
  MatchingDeclarationName:
    active: false
